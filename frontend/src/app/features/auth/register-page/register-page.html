<div class="page-shell">
  <div class="page-container-narrow">

    <div class="page-header">
      <div>
        <div class="text-sm text-gray-600">
          Accueil <span class="mx-1">›</span> Inscription
        </div>
        <h1 class="page-title">Créer un compte</h1>
        <p class="page-subtitle">
          Crée ton profil joueur pour réserver un terrain.
        </p>
      </div>

      <a routerLink="/login" class="secondary-button">
        Se connecter
      </a>
    </div>

    <div *ngIf="errorMessage()" class="status-error mt-6">
      {{ errorMessage() }}
    </div>

    <div class="section-card-plain mt-8">
      <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-4 md:grid-cols-2">

        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Prénom</label>
          <input formControlName="firstName" class="input-field-lg" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Nom</label>
          <input formControlName="lastName" class="input-field-lg" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Email</label>
          <input formControlName="email" class="input-field-lg" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Téléphone</label>
          <input formControlName="phone" class="input-field-lg" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Ville</label>
          <input formControlName="city" class="input-field-lg" />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Niveau</label>
          <select formControlName="level" class="select-field">
            <option value="Débutant">Débutant</option>
            <option value="Intermédiaire">Intermédiaire</option>
            <option value="Avancé">Avancé</option>
          </select>
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-gray-700">Type de membre</label>
          <select formControlName="memberType" class="select-field">
            <option value="FREE">FREE</option>
            <option value="SITE">SITE</option>
            <option value="GLOBAL">GLOBAL</option>
          </select>
        </div>

        <div *ngIf="isSiteMember">
          <label class="mb-2 block text-sm font-semibold text-gray-700">Club</label>
          <select formControlName="siteName" class="select-field">
            <option value="">Choisir un club</option>
            <option *ngFor="let club of clubs" [value]="club.name">
              {{ club.name }}
            </option>
          </select>
        </div>

        <div class="md:col-span-2">
          <button type="submit" class="primary-button-lg w-full">
            S’inscrire
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
