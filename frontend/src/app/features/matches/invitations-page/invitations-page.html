<div class="page-shell">
  <div class="page-container">

    <div class="page-header">
      <div>
        <div class="text-sm text-gray-600">
          Accueil <span class="mx-1">›</span> Mes invitations
        </div>

        <app-page-header
          title="Mes invitations"
          subtitle="Retrouve ici les matches privés auxquels tu as été invité.">
        </app-page-header>
      </div>

      <button
        (click)="navigateToProfile()"
        class="secondary-button">
        ← Retour au profil
      </button>
    </div>

    <div class="mt-8 grid gap-4 lg:grid-cols-2" *ngIf="hasResults(); else emptyState">

      <div
        *ngFor="let reservation of invitations()"
        class="section-card-plain hover:shadow-sm">

        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="badge-private inline-flex items-center gap-2">
              Invitation privée
            </div>

            <h3 class="mt-3 text-lg font-extrabold text-gray-900">{{ reservation.clubName }}</h3>
            <p class="mt-1 text-sm text-gray-600">{{ reservation.courtName }}</p>
          </div>

          <div class="text-right">
            <div class="text-xs text-gray-600">Ta part</div>
            <div class="text-xl font-extrabold text-gray-900">€{{ getAmountPerPlayer(reservation) }}</div>
          </div>
        </div>

        <div class="mt-4 grid gap-3 sm:grid-cols-4">
          <div class="sub-card">
            <div class="field-label">Date</div>
            <div class="field-value">{{ reservation.date || '—' }}</div>
          </div>

          <div class="sub-card">
            <div class="field-label">Heure</div>
            <div class="field-value">{{ reservation.time }}</div>
          </div>

          <div class="sub-card">
            <div class="field-label">Statut</div>
            <div class="mt-1">
              <span
                *ngIf="getInvitationStatus(reservation) === 'PENDING'"
                class="badge-warning">
                En attente
              </span>

              <span
                *ngIf="getInvitationStatus(reservation) === 'ACCEPTED'"
                class="badge-success">
                Acceptée
              </span>
            </div>
          </div>

          <div class="sub-card">
            <div class="field-label">Joueurs</div>
            <div class="field-value">{{ getPlayersLabel(reservation) }}</div>
          </div>
        </div>

        <div class="mt-5 flex flex-col gap-2 sm:flex-row">
          <button
            (click)="navigateToMatchDetail(reservation)"
            class="dark-button w-full">
            Voir détail du match
          </button>
        </div>
      </div>

    </div>

    <ng-template #emptyState>
      <app-empty-state
        title="Aucune invitation"
        message="Quand quelqu’un t’invite à un match privé avec ton email, il apparaîtra ici.">
      </app-empty-state>
    </ng-template>

  </div>
</div>
