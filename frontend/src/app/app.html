<app-header></app-header>
<app-menu></app-menu>
<router-outlet></router-outlet>
<app-footer></app-footer>
<div
  *ngIf="toast() as t"
  class="fixed right-4 top-4 z-[9999] w-full max-w-sm rounded-2xl border border-emerald-200 bg-white p-4 shadow-xl">

  <div class="flex items-start justify-between gap-3">
    <div>
      <div class="text-sm font-extrabold text-gray-900">{{ t.title }}</div>
      <div class="mt-1 text-sm text-gray-600">{{ t.message }}</div>
    </div>

    <button
      (click)="closeToast()"
      class="rounded-lg border px-2 py-1 text-xs font-semibold hover:bg-gray-50">
      ✕
    </button>
  </div>
</div>
