<div class="min-h-screen bg-gray-50 py-10">
  <div class="mx-auto max-w-screen-md px-4 lg:px-8">

    <div class="rounded-3xl border bg-white p-8">
      <div class="inline-flex items-center gap-2 rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700">
        Paiement validé
      </div>

      <h1 class="mt-4 text-3xl font-extrabold text-gray-900">Merci ✅</h1>
      <p class="mt-2 text-sm text-gray-600">
        Ton paiement a été confirmé et ta réservation est validée.
      </p>

      <div class="mt-6 grid gap-3 sm:grid-cols-2">
        <div class="rounded-2xl bg-gray-50 p-4">
          <div class="text-xs text-gray-600">Club</div>
          <div class="mt-1 text-sm font-semibold text-gray-900">{{ clubName() }}</div>
        </div>

        <div class="rounded-2xl bg-gray-50 p-4">
          <div class="text-xs text-gray-600">Terrain</div>
          <div class="mt-1 text-sm font-semibold text-gray-900">{{ courtName() }}</div>
        </div>

        <div class="rounded-2xl bg-gray-50 p-4">
          <div class="text-xs text-gray-600">Créneau</div>
          <div class="mt-1 text-sm font-semibold text-gray-900">{{ time() }}</div>
        </div>

        <div class="rounded-2xl bg-gray-50 p-4">
          <div class="text-xs text-gray-600">Total</div>
          <div class="mt-1 text-sm font-semibold text-gray-900">€{{ total() }}</div>
        </div>
      </div>

      <div class="mt-4 rounded-2xl border p-4">
        <div class="flex items-center justify-between text-sm">
          <span class="text-gray-600">Référence</span>
          <span class="font-extrabold text-gray-900">{{ reference() }}</span>
        </div>
        <p class="mt-2 text-xs text-gray-500">
          Un email de confirmation + QR code peut être envoyé (quand tu auras le backend).
        </p>
      </div>

      <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-end">
        <button
          (click)="goHome()"
          class="w-full sm:w-auto rounded-xl border px-5 py-3 text-sm font-semibold hover:bg-gray-50">
          Retour accueil
        </button>

        <button
          (click)="goBackToClub()"
          class="w-full sm:w-auto rounded-xl bg-emerald-600 px-5 py-3 text-sm font-semibold text-white hover:bg-emerald-700">
          Nouvelle réservation
        </button>
      </div>
    </div>

  </div>
</div>
