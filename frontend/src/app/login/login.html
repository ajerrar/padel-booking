<div class="min-h-screen bg-gray-50 py-10">
  <div class="mx-auto max-w-md px-4">
    <div class="rounded-3xl border bg-white p-6">
      <h1 class="text-2xl font-extrabold text-gray-900">Connexion</h1>
      <p class="mt-1 text-sm text-gray-600">Entre ton email pour te connecter.</p>

      <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <div>
          <label class="text-xs font-medium text-gray-700">Email</label>
          <input
            type="email"
            formControlName="email"
            class="mt-1 w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-200"
            placeholder="admin@padel.com"
          />
        </div>

        <p *ngIf="error()" class="text-sm text-red-600">{{ error() }}</p>

        <button
          type="submit"
          class="w-full rounded-xl bg-emerald-600 px-4 py-3 text-sm font-semibold text-white hover:bg-emerald-700">
          Se connecter
        </button>
      </form>
    </div>
  </div>
</div>
