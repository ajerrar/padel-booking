<div class="section-card-plain p-4">
  <div class="flex items-center justify-between">

    <div>
      <div class="text-xs text-gray-500">
        {{ title }}
      </div>

      <div class="text-2xl font-extrabold text-gray-900 mt-1">
        {{ value }}
      </div>
    </div>

    <div class="text-2xl" *ngIf="icon">
      {{ icon }}
    </div>

  </div>
</div>
