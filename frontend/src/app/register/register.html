<div class="min-h-screen bg-gray-50 py-10">
  <div class="mx-auto max-w-screen-md px-4 lg:px-8">

    <div>
      <div class="text-sm text-gray-600">Accueil <span class="mx-1">›</span> Inscription</div>
      <h1 class="mt-2 text-3xl font-extrabold text-gray-900">Créer un compte</h1>
      <p class="mt-2 text-sm text-gray-600">On te génère un matricule automatiquement.</p>
    </div>

    <form class="mt-6 rounded-3xl border bg-white p-6" [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid gap-4 sm:grid-cols-2">

        <div>
          <label class="text-xs font-medium text-gray-700">Prénom</label>
          <input formControlName="firstName"
                 class="mt-1 w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-200"
                 placeholder="Samir" />
          <p *ngIf="hasError('firstName','required')" class="mt-1 text-xs text-red-600">Prénom obligatoire.</p>
          <p *ngIf="hasError('firstName','minlength')" class="mt-1 text-xs text-red-600">Min 2 caractères.</p>
        </div>

        <div>
          <label class="text-xs font-medium text-gray-700">Nom</label>
          <input formControlName="lastName"
                 class="mt-1 w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-200"
                 placeholder="Ajerrar" />
          <p *ngIf="hasError('lastName','required')" class="mt-1 text-xs text-red-600">Nom obligatoire.</p>
          <p *ngIf="hasError('lastName','minlength')" class="mt-1 text-xs text-red-600">Min 2 caractères.</p>
        </div>

        <div>
          <label class="text-xs font-medium text-gray-700">Email</label>
          <input formControlName="email" type="email"
                 class="mt-1 w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-200"
                 placeholder="samir@mail.com" />
          <p *ngIf="hasError('email','required')" class="mt-1 text-xs text-red-600">Email obligatoire.</p>
          <p *ngIf="hasError('email','email')" class="mt-1 text-xs text-red-600">Email invalide.</p>
        </div>

        <div>
          <label class="text-xs font-medium text-gray-700">Téléphone</label>
          <input formControlName="phone"
                 class="mt-1 w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-200"
                 placeholder="+32 470 00 00 00" />
          <p *ngIf="hasError('phone','required')" class="mt-1 text-xs text-red-600">Téléphone obligatoire.</p>
          <p *ngIf="hasError('phone','pattern')" class="mt-1 text-xs text-red-600">Format invalide.</p>
        </div>

        <div>
          <label class="text-xs font-medium text-gray-700">Ville</label>
          <input formControlName="city"
                 class="mt-1 w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-200"
                 placeholder="Bruxelles" />
          <p *ngIf="hasError('city','required')" class="mt-1 text-xs text-red-600">Ville obligatoire.</p>
        </div>

        <div>
          <label class="text-xs font-medium text-gray-700">Niveau padel</label>
          <select formControlName="level"
                  class="mt-1 w-full rounded-xl border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-200">
            <option>Débutant</option>
            <option>Intermédiaire</option>
            <option>Avancé</option>
          </select>
        </div>
      </div>

      <button type="submit"
              class="mt-6 w-full rounded-xl bg-emerald-600 px-4 py-3 text-sm font-semibold text-white hover:bg-emerald-700">
        S’inscrire
      </button>
    </form>

  </div>
</div>
