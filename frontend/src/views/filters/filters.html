<div class="rounded-2xl border bg-white p-6 mb-6 shadow-sm">
  <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-4">


    <!-- Filtre Localisation -->
    <div>
      <label class="block text-sm font-semibold text-gray-900 mb-2">Localisation</label>
      <select
        [(ngModel)]="selectedLocation"
        (ngModelChange)="onLocationChange()"
        class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-200"
      >
        <option value="">Tous les lieux</option>
        <option *ngFor="let location of locations" [value]="location">
          {{ location }}
        </option>
      </select>
    </div>

    <!-- Filtre Type -->
    <div>
      <label class="block text-sm font-semibold text-gray-900 mb-2">Type</label>
      <select
        [(ngModel)]="selectedType"
        (ngModelChange)="onTypeChange()"
        class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-200"
      >
        <option value="">Tous les types</option>
        <option value="indoor">Indoor</option>
        <option value="outdoor">Outdoor</option>
      </select>
    </div>

    <!-- Filtre Prix -->
    <div>
      <label class="block text-sm font-semibold text-gray-900 mb-2">
        Prix max: €{{ selectedPriceMax }}
      </label>
      <input
        type="range"
        min="{{ priceRange.min }}"
        max="{{ priceRange.max }}"
        [(ngModel)]="selectedPriceMax"
        (ngModelChange)="onPriceChange()"
        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
      />
      <div class="text-xs text-gray-600 mt-1">
        €{{ priceRange.min }} - €{{ priceRange.max }}
      </div>
    </div>
  </div>

  <!-- Boutons -->
  <div class="mt-4 flex gap-3">
    <button
      (click)="applyFilters()"
      class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-semibold hover:bg-emerald-700"
    >
      Appliquer les filtres
    </button>
    <button
      (click)="resetFilters()"
      class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-50"
    >
      Réinitialiser
    </button>
  </div>
</div>
